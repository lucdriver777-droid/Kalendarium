<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Kierowcy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #111;
            color: #ddd;
        }
        h1 { color: #ff6600; text-align: center; }
        .container { max-width: 1200px; margin: auto; }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        input, select { background: #222; color: white; }
        button {
            background: #ff6600;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff8533; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1a1a1a;
        }
        th, td {
            padding: 10px;
            border: 1px solid #444;
            text-align: center;
        }
        th { background: #222; color: white; }
        .action-btn {
            padding: 5px 10px;
            margin: 2px;
            font-size: 0.9em;
        }
        .edit-btn { background: #0066cc; }
        .delete-btn { background: #c00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DZIENNIK KIEROWCY</h1>

        <div>
            <input type="text" id="driver" value="Łukasz Stasiński">
            <input type="text" id="carNo" value="PO8HG90">
        </div>

        <div>
            <input type="date" id="date">
            <select id="type">
                <option value="Załadunek">Załadunek</option>
                <option value="Rozładunek">Rozładunek</option>
            </select>
            <input type="text" id="place" placeholder="Miejscowość">
            <input type="number" id="odometer" placeholder="Stan licznika">
            <button onclick="addEntry()" id="addBtn">Dodaj wpis</button>
            <button onclick="cancelEdit()" id="cancelBtn" style="display:none; background:#666;">Anuluj</button>
        </div>

        <div style="text-align:center; margin:15px 0;">
            <button onclick="exportPDF()">📄 Export do PDF</button>
            <button onclick="exportCSV()">📊 Export do CSV</button>
            <button onclick="clearAll()" style="background:#c00;">Wyczyść wszystko</button>
        </div>

        <table id="table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Typ</th>
                    <th>Miejscowość</th>
                    <th>Stan licznika</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('driverEntries')) || [];
        let editIndex = null;

        function renderTable() {
            const tbody = document.querySelector('#table tbody');
            tbody.innerHTML = '';
            entries.forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${entry.date}</td>
                    <td>${entry.type}</td>
                    <td>${entry.place}</td>
                    <td>${entry.odometer}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editEntry(${index})">Edytuj</button>
                        <button class="action-btn delete-btn" onclick="deleteEntry(${index})">Usuń</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addEntry() {
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const place = document.getElementById('place').value.trim();
            const odometer = document.getElementById('odometer').value;

            if (!date || !place || !odometer) return alert("Wypełnij wszystkie pola!");

            if (editIndex !== null) {
                entries[editIndex] = { date, type, place, odometer };
                editIndex = null;
                document.getElementById('addBtn').textContent = "Dodaj wpis";
                document.getElementById('cancelBtn').style.display = "none";
            } else {
                entries.push({ date, type, place, odometer });
            }

            localStorage.setItem('driverEntries', JSON.stringify(entries));
            renderTable();
            clearForm();
        }

        function editEntry(index) {
            const e = entries[index];
            document.getElementById('date').value = e.date;
            document.getElementById('type').value = e.type;
            document.getElementById('place').value = e.place;
            document.getElementById('odometer').value = e.odometer;
            editIndex = index;
            document.getElementById('addBtn').textContent = "Zapisz zmiany";
            document.getElementById('cancelBtn').style.display = "inline-block";
        }

        function cancelEdit() {
            editIndex = null;
            document.getElementById('addBtn').textContent = "Dodaj wpis";
            document.getElementById('cancelBtn').style.display = "none";
            clearForm();
        }

        function clearForm() {
            document.getElementById('place').value = '';
            document.getElementById('odometer').value = '';
        }

        function deleteEntry(index) {
            if (confirm("Usunąć wpis?")) {
                entries.splice(index, 1);
                localStorage.setItem('driverEntries', JSON.stringify(entries));
                renderTable();
            }
        }

        async function exportPDF() {
            if (entries.length === 0) return alert("Brak wpisów!");

            const driver = document.getElementById('driver').value || "Kierowca";
            const carNo = document.getElementById('carNo').value || "";

            let html = `
                <div style="padding:30px; font-family:Arial,sans-serif; color:#000; background:#fff;">
                    <h1 style="text-align:center; margin:0 0 10px 0;">Dziennik kierowcy</h1>
                    <p style="text-align:center; margin-bottom:30px;">Kierowca: ${driver} • Nr auta: ${carNo}</p>
                    
                    <table border="1" cellpadding="10" cellspacing="0" style="width:100%; border-collapse:collapse; border:2px solid #000; font-size:11px;">
                        <tr style="font-weight:bold; background:#f8f8f8;">
                            <th style="border:1px solid #000;">Data Z.</th>
                            <th style="border:1px solid #000;">Miejsce Z.</th>
                            <th style="border:1px solid #000;">Stan licznika</th>
                            <th style="border:1px solid #000;">Data R.</th>
                            <th style="border:1px solid #000;">Miejsce R.</th>
                            <th style="border:1px solid #000;">Stan licznika</th>
                        </tr>`;

            const sorted = [...entries].sort((a,b) => new Date(a.date) - new Date(b.date));

            let i = 0;
            while (i < sorted.length) {
                if (sorted[i].type === "Załadunek" && i+1 < sorted.length && sorted[i+1].type === "Rozładunek") {
                    const z = sorted[i];
                    const r = sorted[i+1];
                    html += `<tr>
                        <td style="border:1px solid #000;">${z.date}</td>
                        <td style="border:1px solid #000;">${z.place}</td>
                        <td style="border:1px solid #000;">${z.odometer}</td>
                        <td style="border:1px solid #000;">${r.date}</td>
                        <td style="border:1px solid #000;">${r.place}</td>
                        <td style="border:1px solid #000;">${r.odometer}</td>
                    </tr>`;
                    i += 2;
                } else {
                    const e = sorted[i];
                    html += `<tr>
                        <td style="border:1px solid #000;">${e.type==="Załadunek"?e.date:""}</td>
                        <td style="border:1px solid #000;">${e.type==="Załadunek"?e.place:""}</td>
                        <td style="border:1px solid #000;">${e.type==="Załadunek"?e.odometer:""}</td>
                        <td style="border:1px solid #000;">${e.type==="Rozładunek"?e.date:""}</td>
                        <td style="border:1px solid #000;">${e.type==="Rozładunek"?e.place:""}</td>
                        <td style="border:1px solid #000;">${e.type==="Rozładunek"?e.odometer:""}</td>
                    </tr>`;
                    i++;
                }
            }

            html += `</table></div>`;

            const temp = document.createElement('div');
            temp.innerHTML = html;
            document.body.appendChild(temp);

            await html2pdf().set({
                margin: [20, 15, 20, 15],
                filename: `Dziennik_${new Date().toISOString().slice(0,10)}.pdf`,
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' },
                html2canvas: { scale: 2, useCORS: true, logging: false }
            }).from(temp).save();

            document.body.removeChild(temp);
        }

        function exportCSV() {
            if (entries.length === 0) return alert("Brak wpisów!");
            let csv = "Data Z.;Miejsce Z.;Stan Z.;Data R.;Miejsce R.;Stan R.\n";
            entries.forEach(e => csv += `${e.date};${e.place};${e.odometer};;;\n`);
            const blob = new Blob([csv], {type: 'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Dziennik_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function clearAll() {
            if (confirm("Na pewno wyczyścić WSZYSTKO?")) {
                entries = [];
                localStorage.clear();
                renderTable();
            }
        }

        window.onload = () => {
            document.getElementById('date').valueAsDate = new Date();
            renderTable();
        };
    </script>
</body>
</html>
