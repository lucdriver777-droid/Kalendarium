<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Kierowcy</title>
    <meta name="theme-color" content="#ff6600">
    <style>
        body { font-family: Arial, sans-serif; margin:0; background:#111; color:white; padding:10px; }
        h1 { text-align:center; color:#ff6600; }
        input, select, button { width:100%; padding:15px; margin:8px 0; font-size:18px; border-radius:8px; }
        input, select { background:#333; color:white; }
        button { background:#ff6600; color:black; font-weight:bold; }
        .red { background:#c00; }
        table { width:100%; border-collapse:collapse; margin-top:15px; }
        th, td { padding:12px; border:1px solid #555; text-align:center; }
        th { background:#ff6600; color:black; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>
<body>

<h1>🚛 Dziennik Kierowcy</h1>

<input type="text" id="driver" placeholder="Kierowca" oninput="saveHeader()">
<input type="text" id="carNo" placeholder="Nr auta" oninput="saveHeader()">
<select id="type"><option value="Załadunek">Załadunek</option><option value="Rozładunek">Rozładunek</option></select>
<input type="date" id="date">
<input type="text" id="place" placeholder="Miejsce">
<input type="number" id="odometer" placeholder="Stan licznika (km)">

<button onclick="addEntry()">➕ Dodaj wpis</button>
<button onclick="exportPDF()" style="font-size:20px; background:#ff8800;">📄 GENERUJ PDF</button>
<button onclick="exportCSV()" style="background:#0066cc;">💾 CSV</button>
<button onclick="clearLog()" class="red">🗑️ Wyczyść wszystko</button>

<table id="logTable">
    <thead><tr><th>#</th><th>Data</th><th>Rodzaj</th><th>Miejsce</th><th>Licznik</th><th>Akcje</th></tr></thead>
    <tbody></tbody>
</table>

<script>
let entries = [];

function load() {
    entries = JSON.parse(localStorage.getItem('driverLog') || '[]');
}

function persist() {
    localStorage.setItem('driverLog', JSON.stringify(entries));
}

function render() {
    const tbody = document.querySelector('#logTable tbody');
    tbody.innerHTML = '';
    entries.forEach((e, i) => {
        const row = tbody.insertRow();
        row.innerHTML = `<td>${i+1}</td><td>${e.date}</td><td>${e.type}</td><td>${e.place}</td><td>${e.odometer}</td>
            <td><button onclick="deleteEntry(${e.id})">🗑️</button></td>`;
    });
}

// ==================== PDF ====================
async function exportPDF() {
    if (entries.length === 0) return alert("Brak wpisów!");

    const driver = document.getElementById('driver').value || "Kierowca";
    const carNo = document.getElementById('carNo').value || "";

    let html = `
        <div style="padding:30px; font-family:Arial;">
            <h1 style="text-align:center; color:#ff6600;">DZIENNIK KIEROWCY</h1>
            <p style="text-align:center;">${driver} • ${carNo} • ${new Date().toLocaleDateString('pl-PL')}</p>
            <table border="1" cellpadding="12" style="width:100%; border-collapse:collapse;">
                <tr style="background:#ff6600; color:black;">
                    <th>Lp.</th><th>Data</th><th>Rodzaj</th><th>Miejsce</th><th>Licznik km</th>
                </tr>`;

    entries.forEach((e, i) => {
        html += `<tr>
            <td>${i+1}</td>
            <td>${e.date}</td>
            <td>${e.type}</td>
            <td>${e.place}</td>
            <td>${e.odometer}</td>
        </tr>`;
    });

    html += `</table></div>`;

    const temp = document.createElement('div');
    temp.innerHTML = html;
    document.body.appendChild(temp);

    await html2pdf().set({
        margin: 10,
        filename: 'Dziennik_Kierowcy.pdf',
        jsPDF: { orientation: 'landscape' }
    }).from(temp).save();

    document.body.removeChild(temp);
}

// ==================== CSV (przywrócony) ====================
function exportCSV() {
    if (entries.length === 0) return alert("Brak wpisów!");

    let csv = "Lp.;Data;Rodzaj;Miejsce;Licznik_km\n";
    entries.forEach((e, i) => {
        csv += `${i+1};${e.date};${e.type};${e.place};${e.odometer}\n`;
    });

    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'Dziennik_Kierowcy.csv';
    link.click();
}

// ==================== Reszta ====================
function addEntry() {
    const entry = {
        id: Date.now(),
        date: document.getElementById('date').value || new Date().toISOString().slice(0,10),
        type: document.getElementById('type').value,
        place: document.getElementById('place').value.trim(),
        odometer: document.getElementById('odometer').value.trim()
    };
    if (!entry.place || !entry.odometer) return alert("Wpisz miejsce i licznik!");
    
    entries.unshift(entry);
    persist();
    render();
    document.getElementById('place').value = '';
    document.getElementById('odometer').value = '';
}

function deleteEntry(id) {
    if (confirm("Usunąć wpis?")) {
        entries = entries.filter(e => e.id !== id);
        persist();
        render();
    }
}

function clearLog() {
    if (confirm("Wyczyścić wszystko?") && confirm("Na pewno?")) {
        localStorage.clear();
        entries = [];
        render();
    }
}

function saveHeader() {
    localStorage.setItem('driverName', document.getElementById('driver').value);
    localStorage.setItem('carNumber', document.getElementById('carNo').value);
}

// Start
window.onload = () => {
    load();
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
    document.getElementById('driver').value = localStorage.getItem('driverName') || '';
    document.getElementById('carNo').value = localStorage.getItem('carNumber') || '';
    render();
};
</script>
</body>
</html>
