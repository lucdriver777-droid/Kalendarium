<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Kierowcy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #111;
            color: #ddd;
        }
        h1 { color: #ff6600; text-align: center; }
        .container { max-width: 1100px; margin: auto; }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        input, select { background: #222; color: white; width: 100%; max-width: 300px; }
        button {
            background: #ff6600;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff8533; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1a1a1a;
        }
        th, td {
            padding: 10px;
            border: 1px solid #444;
            text-align: center;
        }
        th { background: #ff6600; color: black; }
        .btn-group { text-align: center; margin: 15px 0; }
        .delete-btn {
            background: #c00;
            padding: 5px 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DZIENNIK KIEROWCY</h1>

        <div>
            <input type="text" id="driver" placeholder="Imię i nazwisko kierowcy" value="Lucjan">
            <input type="text" id="carNo" placeholder="Numer rejestracyjny" value="XXX 7777">
        </div>

        <div>
            <input type="date" id="date">
            <select id="type">
                <option value="Załadunek">Załadunek</option>
                <option value="Rozładunek">Rozładunek</option>
            </select>
            <input type="text" id="place" placeholder="Miejscowość">
            <input type="number" id="odometer" placeholder="Licznik km">
            <button onclick="addEntry()">Dodaj wpis</button>
        </div>

        <div class="btn-group">
            <button onclick="exportPDF()">📄 Export do PDF (z parami tras)</button>
            <button onclick="exportCSV()">📊 Export do CSV</button>
            <button onclick="clearAll()" style="background:#c00;">🗑 Wyczyść wszystko</button>
        </div>

        <table id="table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Typ</th>
                    <th>Miejscowość</th>
                    <th>Licznik km</th>
                    <th>Akcja</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('driverEntries')) || [];

        function renderTable() {
            const tbody = document.querySelector('#table tbody');
            tbody.innerHTML = '';
            entries.forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${entry.date}</td>
                    <td>${entry.type}</td>
                    <td>${entry.place}</td>
                    <td>${entry.odometer}</td>
                    <td><button class="delete-btn" onclick="deleteEntry(${index})">Usuń</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addEntry() {
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const place = document.getElementById('place').value.trim();
            const odometer = document.getElementById('odometer').value;

            if (!date || !place || !odometer) {
                alert("Wypełnij wszystkie pola!");
                return;
            }

            entries.push({ date, type, place, odometer });
            localStorage.setItem('driverEntries', JSON.stringify(entries));
            renderTable();

            // Czyść pola
            document.getElementById('place').value = '';
            document.getElementById('odometer').value = '';
        }

        function deleteEntry(index) {
            if (confirm("Usunąć ten wpis?")) {
                entries.splice(index, 1);
                localStorage.setItem('driverEntries', JSON.stringify(entries));
                renderTable();
            }
        }

        async function exportPDF() {
            if (entries.length === 0) return alert("Brak wpisów do wygenerowania PDF!");

            const driver = document.getElementById('driver').value || "Kierowca";
            const carNo = document.getElementById('carNo').value || "";

            let html = `
                <div style="padding:30px; font-family:Arial,sans-serif; max-width:1100px; margin:auto;">
                    <h1 style="text-align:center; color:#ff6600;">DZIENNIK KIEROWCY</h1>
                    <p style="text-align:center; font-size:18px;">${driver} • ${carNo} • ${new Date().toLocaleDateString('pl-PL')}</p>
                    
                    <table border="1" cellpadding="10" style="width:100%; border-collapse:collapse; margin-top:20px;">
                        <tr style="background:#ff6600; color:black; font-weight:bold;">
                            <th>Lp.</th>
                            <th>Data</th>
                            <th>Trasa</th>
                            <th>Załadunek</th>
                            <th>Rozładunek</th>
                            <th>Licznik start</th>
                            <th>Licznik koniec</th>
                            <th>Przejechano km</th>
                        </tr>`;

            const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));

            let tripCounter = 1;
            let i = 0;

            while (i < sorted.length) {
                const current = sorted[i];

                if (current.type === "Załadunek" && i + 1 < sorted.length && sorted[i + 1].type === "Rozładunek") {
                    const loading = current;
                    const unloading = sorted[i + 1];
                    const kmStart = parseInt(loading.odometer) || 0;
                    const kmEnd = parseInt(unloading.odometer) || 0;
                    const distance = kmEnd > kmStart ? kmEnd - kmStart : 0;

                    html += `
                        <tr>
                            <td>${tripCounter++}</td>
                            <td>${loading.date}</td>
                            <td><strong>${loading.place} → ${unloading.place}</strong></td>
                            <td>${loading.place}</td>
                            <td>${unloading.place}</td>
                            <td>${kmStart}</td>
                            <td>${kmEnd}</td>
                            <td><strong>${distance} km</strong></td>
                        </tr>`;
                    i += 2;
                } else {
                    html += `
                        <tr style="background:#333; color:#bbb;">
                            <td>${tripCounter++}</td>
                            <td>${current.date}</td>
                            <td colspan="5">${current.type}: ${current.place}</td>
                            <td>${current.odometer} km</td>
                        </tr>`;
                    i++;
                }
            }

            html += `</table></div>`;

            const temp = document.createElement('div');
            temp.innerHTML = html;
            document.body.appendChild(temp);

            await html2pdf().set({
                margin: [15, 10, 15, 10],
                filename: `Dziennik_Kierowcy_${new Date().toISOString().slice(0,10)}.pdf`,
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' },
                html2canvas: { scale: 2 }
            }).from(temp).save();

            document.body.removeChild(temp);
        }

        function exportCSV() {
            if (entries.length === 0) return alert("Brak wpisów!");

            let csv = "Data;Typ;Miejscowość;Licznik km\n";
            entries.forEach(e => {
                csv += `${e.date};${e.type};${e.place};${e.odometer}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Dziennik_Kierowcy_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function clearAll() {
            if (confirm("Na pewno wyczyścić WSZYSTKIE wpisy?")) {
                entries = [];
                localStorage.removeItem('driverEntries');
                renderTable();
            }
        }

        // Inicjalizacja
        window.onload = () => {
            document.getElementById('date').valueAsDate = new Date();
            renderTable();
        };
    </script>
</body>
</html>
