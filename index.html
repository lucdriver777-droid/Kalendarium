<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Kierowcy</title>
    <meta name="theme-color" content="#ff6600">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root { --orange: #ff6600; --dark: #111; --gray: #222; }
        body { font-family: Arial, sans-serif; margin:0; background:var(--dark); color:white; min-height:100vh; }
        h1 { text-align:center; color:var(--orange); margin:20px 0; }
        .container { display:flex; flex-direction:column; gap:15px; padding:10px; max-width:1400px; margin:0 auto; }
        .box { background:var(--gray); padding:20px; border-radius:12px; border:2px solid var(--orange); }
        label { display:block; margin:12px 0 6px; font-weight:bold; }
        input, select, button { width:100%; padding:14px; font-size:17px; border-radius:8px; border:none; }
        input, select { background:#333; color:white; }
        button { background:var(--orange); color:black; font-weight:bold; cursor:pointer; padding:15px; }
        button:hover { background:#ff8833; }
        .btn-red { background:#c00; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; text-align:center; border:1px solid #444; }
        th { background:var(--orange); color:black; }

        @media (min-width: 900px) {
            .container { flex-direction: row; }
            .form-box { width: 38%; }
            .table-box { width: 62%; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container">
    <div class="box form-box">
        <h1>🚛 Dziennik Kierowcy</h1>
        
        <div class="row">
            <div><label>Kierowca</label><input type="text" id="driver" oninput="saveHeader()"></div>
            <div><label>Nr auta</label><input type="text" id="carNo" oninput="saveHeader()"></div>
        </div>
        <div class="row">
            <div><label>Rodzaj</label>
                <select id="type">
                    <option value="Załadunek">Załadunek</option>
                    <option value="Rozładunek">Rozładunek</option>
                </select>
            </div>
            <div><label>Data</label><input type="date" id="date"></div>
        </div>
        <label>Miejsce</label><input type="text" id="place" placeholder="Miasto / Magazyn">
        <label>Stan licznika (km)</label><input type="number" id="odometer" placeholder="152340">

        <button onclick="addEntry()">➕ Dodaj wpis</button>
        <button onclick="exportPDF()" style="font-size:19px;">📄 PDF - Załadunek | Rozładunek</button>
        <button onclick="exportCSV()" class="btn-secondary">💾 CSV</button>
        <button onclick="clearLog()" class="btn-red">🗑️ Wyczyść wszystko</button>
    </div>

    <div class="box table-box">
        <table id="logTable">
            <thead><tr><th>#</th><th>Data</th><th>Rodzaj</th><th>Miejsce</th><th>Licznik km</th><th>Akcje</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
// ==================== DANE ====================
let entries = [];

function load() {
    const data = localStorage.getItem('driverLog_v5');
    return data ? JSON.parse(data) : [];
}

function persist() {
    localStorage.setItem('driverLog_v5', JSON.stringify(entries));
}

function render() {
    const tbody = document.querySelector('#logTable tbody');
    tbody.innerHTML = '';
    entries.forEach((e, i) => {
        const row = tbody.insertRow();
        row.innerHTML = `
            <td>${i+1}</td>
            <td>${e.date}</td>
            <td>${e.type}</td>
            <td>${e.place}</td>
            <td>${e.odometer}</td>
            <td>
                <button onclick="editEntry(${e.id})">✏️</button>
                <button onclick="deleteEntry(${e.id})">🗑️</button>
            </td>`;
    });
}

// ==================== PDF Z PODKOLUMNAMI ====================
async function exportPDF() {
    if (entries.length === 0) return alert("Brak wpisów!");

    const driver = document.getElementById('driver').value || localStorage.getItem('driverName') || "Kierowca";
    const carNo = document.getElementById('carNo').value || localStorage.getItem('carNumber') || "";

    let html = `
        <div style="padding:25px; font-family:Arial,sans-serif; background:white;">
            <h1 style="text-align:center; color:#ff6600;">DZIENNIK KIEROWCY</h1>
            <p style="text-align:center; font-size:18px; margin-bottom:20px;">
                ${driver}  •  ${carNo}  •  ${new Date().toLocaleDateString('pl-PL')}
            </p>
            
            <table border="1" cellpadding="10" style="width:100%; border-collapse:collapse; border:3px solid #ff6600;">
                <thead>
                    <tr style="background:#ff6600; color:black;">
                        <th colspan="3" style="background:#ff8800;">ZAŁADUNEK</th>
                        <th colspan="3" style="background:#ff8800;">ROZŁADUNEK</th>
                    </tr>
                    <tr style="background:#ff6600; color:black;">
                        <th>Data</th><th>Miejsce</th><th>Km</th>
                        <th>Data</th><th>Miejsce</th><th>Km</th>
                    </tr>
                </thead>
                <tbody>`;

    // Parowanie wpisów
    let loadEntry = null;
    const sorted = [...entries].sort((a,b) => a.ts - b.ts); // od najstarszego

    sorted.forEach(e => {
        if (e.type === "Załadunek") {
            if (loadEntry) {
                // poprzedni załadunek bez rozładunku
                html += `<tr>
                    <td>${loadEntry.date}</td><td>${loadEntry.place}</td><td>${loadEntry.odometer}</td>
                    <td></td><td></td><td></td>
                </tr>`;
            }
            loadEntry = e;
        } else if (e.type === "Rozładunek" && loadEntry) {
            html += `<tr>
                <td>${loadEntry.date}</td><td>${loadEntry.place}</td><td>${loadEntry.odometer}</td>
                <td>${e.date}</td><td>${e.place}</td><td>${e.odometer}</td>
            </tr>`;
            loadEntry = null;
        }
    });

    // Ostatni nieparowany załadunek
    if (loadEntry) {
        html += `<tr>
            <td>${loadEntry.date}</td><td>${loadEntry.place}</td><td>${loadEntry.odometer}</td>
            <td></td><td></td><td></td>
        </tr>`;
    }

    html += `</tbody></table></div>`;

    const element = document.createElement('div');
    element.innerHTML = html;
    document.body.appendChild(element);

    await html2pdf().set({
        margin: 10,
        filename: `Dziennik_${new Date().toISOString().slice(0,10)}.pdf`,
        jsPDF: { orientation: 'landscape', format: 'a4' },
        html2canvas: { scale: 2 }
    }).from(element).save();

    document.body.removeChild(element);
}

function exportCSV() {
    // Prosty CSV - możesz rozwinąć później
    alert("CSV jeszcze nie zaimplementowany w tej wersji.\nUżyj PDF.");
}

// ==================== Podstawowe funkcje ====================
function addEntry() {
    const type = document.getElementById('type').value;
    const date = document.getElementById('date').value || new Date().toISOString().slice(0,10);
    const place = document.getElementById('place').value.trim();
    const odo = document.getElementById('odometer').value.trim();

    if (!place || !odo) return alert("Miejsce i stan licznika są wymagane!");

    entries.unshift({ id: Date.now(), date, type, place, odometer: odo, ts: Date.now() });
    persist();
    render();
    document.getElementById('place').value = '';
    document.getElementById('odometer').value = '';
}

function deleteEntry(id) {
    if (confirm("Usunąć wpis?")) {
        entries = entries.filter(e => e.id !== id);
        persist();
        render();
    }
}

function editEntry(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    e.date = prompt("Data:", e.date) || e.date;
    e.type = prompt("Rodzaj:", e.type) || e.type;
    e.place = prompt("Miejsce:", e.place) || e.place;
    e.odometer = prompt("Licznik:", e.odometer) || e.odometer;
    persist();
    render();
}

function clearLog() {
    if (confirm("Wyczyścić wszystko?") && confirm("Na pewno?")) {
        localStorage.clear();
        entries = [];
        render();
        document.getElementById('driver').value = '';
        document.getElementById('carNo').value = '';
    }
}

function saveHeader() {
    localStorage.setItem('driverName', document.getElementById('driver').value);
    localStorage.setItem('carNumber', document.getElementById('carNo').value);
}

// Start
window.onload = () => {
    entries = load();
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
    document.getElementById('driver').value = localStorage.getItem('driverName') || '';
    document.getElementById('carNo').value = localStorage.getItem('carNumber') || '';
    render();
};
</script>
</body>
</html>
