<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Kierowcy</title>
    <meta name="theme-color" content="#ff6600">
    <style>
        body { font-family: Arial, sans-serif; margin:0; background:#111; color:white; }
        h1 { text-align:center; color:#ff6600; }
        .container { padding:10px; max-width:1400px; margin:auto; }
        .box { background:#222; padding:20px; border-radius:12px; border:2px solid #ff6600; margin-bottom:15px; }
        input, select, button { width:100%; padding:14px; margin:8px 0; font-size:17px; border-radius:8px; }
        input, select { background:#333; color:white; }
        button { background:#ff6600; color:black; font-weight:bold; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; border:1px solid #444; text-align:center; }
        th { background:#ff6600; color:black; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container">
    <div class="box">
        <h1>🚛 Dziennik Kierowcy</h1>
        <input type="text" id="driver" placeholder="Kierowca" oninput="saveHeader()">
        <input type="text" id="carNo" placeholder="Nr auta" oninput="saveHeader()">
        <select id="type"><option value="Załadunek">Załadunek</option><option value="Rozładunek">Rozładunek</option></select>
        <input type="date" id="date">
        <input type="text" id="place" placeholder="Miejsce">
        <input type="number" id="odometer" placeholder="Stan licznika">

        <button onclick="addEntry()">➕ Dodaj wpis</button>
        <button onclick="exportPDF()" style="font-size:20px;">📄 PDF (prosty)</button>
        <button onclick="clearLog()" style="background:#c00;">🗑️ Wyczyść wszystko</button>
    </div>

    <div class="box">
        <table id="logTable">
            <thead><tr><th>#</th><th>Data</th><th>Rodzaj</th><th>Miejsce</th><th>Licznik</th><th>Akcje</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
let entries = [];

function load() {
    return JSON.parse(localStorage.getItem('driverLog') || '[]');
}

function persist() {
    localStorage.setItem('driverLog', JSON.stringify(entries));
}

function render() {
    const tbody = document.querySelector('#logTable tbody');
    tbody.innerHTML = '';
    entries.forEach((e,i) => {
        const row = tbody.insertRow();
        row.innerHTML = `<td>${i+1}</td><td>${e.date}</td><td>${e.type}</td><td>${e.place}</td><td>${e.odometer}</td>
            <td><button onclick="deleteEntry(${e.id})">🗑️</button></td>`;
    });
}

async function exportPDF() {
    if (entries.length === 0) return alert("Brak wpisów!");

    const driver = document.getElementById('driver').value || "Kierowca";
    const carNo = document.getElementById('carNo').value || "";

    let html = `
        <div style="padding:30px; font-family:Arial;">
            <h1 style="text-align:center; color:#ff6600;">DZIENNIK KIEROWCY</h1>
            <p style="text-align:center;">${driver} • ${carNo} • ${new Date().toLocaleDateString('pl-PL')}</p>
            <table border="1" cellpadding="12" style="width:100%; border-collapse:collapse;">
                <tr style="background:#ff6600; color:black;">
                    <th>Lp.</th><th>Data</th><th>Rodzaj</th><th>Miejsce</th><th>Licznik (km)</th>
                </tr>`;

    entries.forEach((e, i) => {
        html += `<tr>
            <td>${i+1}</td>
            <td>${e.date}</td>
            <td>${e.type}</td>
            <td>${e.place}</td>
            <td>${e.odometer}</td>
        </tr>`;
    });

    html += `</table></div>`;

    const element = document.createElement('div');
    element.innerHTML = html;
    document.body.appendChild(element);

    await html2pdf().set({
        margin: 10,
        filename: 'Dziennik_Kierowcy.pdf',
        jsPDF: { orientation: 'landscape' }
    }).from(element).save();

    document.body.removeChild(element);
}

function addEntry() {
    const entry = {
        id: Date.now(),
        date: document.getElementById('date').value || new Date().toISOString().slice(0,10),
        type: document.getElementById('type').value,
        place: document.getElementById('place').value,
        odometer: document.getElementById('odometer').value
    };
    if (!entry.place || !entry.odometer) return alert("Miejsce i licznik wymagane!");
    entries.unshift(entry);
    persist();
    render();
    document.getElementById('place').value = '';
    document.getElementById('odometer').value = '';
}

function deleteEntry(id) {
    if (confirm("Usunąć?")) {
        entries = entries.filter(e => e.id !== id);
        persist();
        render();
    }
}

function clearLog() {
    if (confirm("Wyczyścić wszystko?") && confirm("Na pewno?")) {
        localStorage.clear();
        entries = [];
        render();
    }
}

function saveHeader() {
    localStorage.setItem('driverName', document.getElementById('driver').value);
    localStorage.setItem('carNumber', document.getElementById('carNo').value);
}

window.onload = () => {
    entries = load();
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
    document.getElementById('driver').value = localStorage.getItem('driverName') || '';
    document.getElementById('carNo').value = localStorage.getItem('carNumber') || '';
    render();
};
</script>
</body>
</html>
