<!DOCTYPE html>
<html lang="pl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ff6600">
    <style>
        body { font-family: Arial, sans-serif; margin:0; background:#111; color:white; padding:10px; }

        input, select, button { width:100%; padding:15px; margin:8px 0; font-size:18px; border-radius:8px; }
        input, select { background:#333; color:white; }
        button { background:#ff6600; color:black; font-weight:bold; }
        .red { background:#c00; }
        table { width:100%; border-collapse:collapse; margin-top:15px; }
        th, td { padding:12px; border:1px solid #555; text-align:center; }
        th { background:#ff6600; color:black; }
    </style>

<body>

<h1>🚛 Dziennik Kierowcy</h1>

<input type="text" id="driver" placeholder="Kierowca" oninput="saveHeader()">
<input type="text" id="carNo" placeholder="Nr auta" oninput="saveHeader()">
<select id="type"><option value="Załadunek">Załadunek</option><option value="Rozładunek">Rozładunek</option></select>
<input type="date" id="date">
<input type="text" id="place" placeholder="Miejsce">
<input type="number" id="odometer" placeholder="Stan licznika (km)">

<button onclick="addEntry()">➕ Dodaj wpis</button>
<button onclick="exportPDF()" style="font-size:20px; background:#ff8800;">📄 GENERUJ PDF</button>
<button onclick="exportCSV()" style="background:#0066cc;">💾 CSV</button>
<button onclick="clearLog()" class="red">🗑️ Wyczyść wszystko</button>

<table id="logTable">
    <thead><tr><th>#</th><th>Data</th><th>Rodzaj</th><th>Miejsce</th><th>Licznik</th><th>Akcje</th></tr></thead>
    <tbody></tbody>
</table>

<script>
let entries = [];

function load() {
    entries = JSON.parse(localStorage.getItem('driverLog') || '[]');
}

function persist() {
    localStorage.setItem('driverLog', JSON.stringify(entries));
}

function render() {
    const tbody = document.querySelector('#logTable tbody');
    tbody.innerHTML = '';
    entries.forEach((e, i) => {
        const row = tbody.insertRow();
        row.innerHTML = `<td>${i+1}</td><td>${e.date}</td><td>${e.type}</td><td>${e.place}</td><td>${e.odometer}</td>
            <td><button onclick="deleteEntry(${e.id})">🗑️</button></td>`;
    });
}
