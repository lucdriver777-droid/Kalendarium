<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Kierowcy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #111;
            color: #ddd;
        }
        h1 { color: #ff6600; text-align: center; }
        .container { max-width: 1200px; margin: auto; }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        input, select { background: #222; color: white; }
        button {
            background: #ff6600;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff8533; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1a1a1a;
        }
        th, td {
            padding: 10px;
            border: 1px solid #444;
            text-align: center;
        }
        th { background: #ff6600; color: black; }
        .delete-btn {
            background: #c00;
            padding: 5px 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DZIENNIK KIEROWCY</h1>

        <div>
            <input type="text" id="driver" placeholder="Imię i nazwisko" value="Łukasz Stasiński">
            <input type="text" id="carNo" placeholder="Nr auta" value="PO8HG90">
        </div>

        <div>
            <input type="date" id="date">
            <select id="type">
                <option value="Załadunek">Załadunek</option>
                <option value="Rozładunek">Rozładunek</option>
            </select>
            <input type="text" id="place" placeholder="Miejscowość">
            <input type="number" id="odometer" placeholder="Stan licznika">
            <button onclick="addEntry()">Dodaj wpis</button>
        </div>

        <div style="text-align:center; margin:15px 0;">
            <button onclick="exportPDF()">📄 Export do PDF (jak na screenie)</button>
            <button onclick="exportCSV()">📊 Export do CSV</button>
            <button onclick="clearAll()" style="background:#c00;">🗑 Wyczyść wszystko</button>
        </div>

        <table id="table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Typ</th>
                    <th>Miejscowość</th>
                    <th>Stan licznika</th>
                    <th>Akcja</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('driverEntries')) || [];

        function renderTable() {
            const tbody = document.querySelector('#table tbody');
            tbody.innerHTML = '';
            entries.forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${entry.date}</td>
                    <td>${entry.type}</td>
                    <td>${entry.place}</td>
                    <td>${entry.odometer}</td>
                    <td><button class="delete-btn" onclick="deleteEntry(${index})">Usuń</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addEntry() {
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const place = document.getElementById('place').value.trim();
            const odometer = document.getElementById('odometer').value;

            if (!date || !place || !odometer) {
                alert("Wypełnij wszystkie pola!");
                return;
            }

            entries.push({ date, type, place, odometer });
            localStorage.setItem('driverEntries', JSON.stringify(entries));
            renderTable();

            document.getElementById('place').value = '';
            document.getElementById('odometer').value = '';
        }

        function deleteEntry(index) {
            if (confirm("Usunąć wpis?")) {
                entries.splice(index, 1);
                localStorage.setItem('driverEntries', JSON.stringify(entries));
                renderTable();
            }
        }

        // ====================== PDF – FORMAT JAK NA SCREENIE ======================
        async function exportPDF() {
            if (entries.length === 0) return alert("Brak wpisów!");

            const driver = document.getElementById('driver').value || "Kierowca";
            const carNo = document.getElementById('carNo').value || "";

            let html = `
                <h1 style="text-align:center;">Dziennik kierowcy</h1>
                <p style="text-align:center;">Kierowca: ${driver} • Nr auta: ${carNo}</p>
                <table border="1" cellpadding="8" style="width:100%; border-collapse:collapse; font-size:11px; margin-top:20px;">
                    <thead>
                        <tr style="background:#ff6600; color:black; font-weight:bold;">
                            <th>Data Z.</th>
                            <th>Miejsce Z.</th>
                            <th>Stan licznika</th>
                            <th>Data R.</th>
                            <th>Miejsce R.</th>
                            <th>Stan licznika</th>
                        </tr>
                    </thead>
                    <tbody>`;

            const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));

            let i = 0;
            while (i < sorted.length) {
                if (sorted[i].type === "Załadunek" && i + 1 < sorted.length && sorted[i+1].type === "Rozładunek") {
                    const z = sorted[i];
                    const r = sorted[i+1];

                    html += `
                        <tr>
                            <td>${z.date}</td>
                            <td>${z.place}</td>
                            <td>${z.odometer}</td>
                            <td>${r.date}</td>
                            <td>${r.place}</td>
                            <td>${r.odometer}</td>
                        </tr>`;
                    i += 2;
                } else {
                    // pojedynczy wpis (bez pary)
                    const e = sorted[i];
                    html += `
                        <tr>
                            <td>${e.type === "Załadunek" ? e.date : ""}</td>
                            <td>${e.type === "Załadunek" ? e.place : ""}</td>
                            <td>${e.type === "Załadunek" ? e.odometer : ""}</td>
                            <td>${e.type === "Rozładunek" ? e.date : ""}</td>
                            <td>${e.type === "Rozładunek" ? e.place : ""}</td>
                            <td>${e.type === "Rozładunek" ? e.odometer : ""}</td>
                        </tr>`;
                    i++;
                }
            }

            html += `</tbody></table>`;

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            document.body.appendChild(tempDiv);

            await html2pdf().set({
                margin: 10,
                filename: `Dziennik_Kierowcy_${new Date().toISOString().slice(0,10)}.pdf`,
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' },
                html2canvas: { scale: 2 }
            }).from(tempDiv).save();

            document.body.removeChild(tempDiv);
        }

        function exportCSV() {
            if (entries.length === 0) return alert("Brak wpisów!");
            let csv = "Data Z.;Miejsce Z.;Stan licznika Z.;Data R.;Miejsce R.;Stan licznika R.\n";
            // prosty eksport liniowy - możesz później ulepszyć
            entries.forEach(e => {
                csv += `${e.date};${e.place};${e.odometer};;;\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Dziennik_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function clearAll() {
            if (confirm("Wyczyścić wszystkie wpisy?")) {
                entries = [];
                localStorage.removeItem('driverEntries');
                renderTable();
            }
        }

        window.onload = () => {
            document.getElementById('date').valueAsDate = new Date();
            renderTable();
        };
    </script>
</body>
</html>
